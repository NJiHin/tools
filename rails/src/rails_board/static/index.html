<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <main id="main">
    <header id="head"></header>
    <div id="cols"></div>
  </main>
</div>
<div id="scrim" hidden>
  <section id="peek" role="dialog" aria-modal="true" aria-label="Issue">
    <div id="peek-bar"></div>
    <div id="peek-scroll" tabindex="-1"></div>
    <div id="peek-foot">
      <div id="settle"></div>
      <label id="composer" class="prompt"><span aria-hidden="true">❯</span><textarea id="draft" rows="1" aria-label="Message to Claude. Enter sends, Shift and Enter adds a line, Escape takes back the last message"></textarea></label>
    </div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
